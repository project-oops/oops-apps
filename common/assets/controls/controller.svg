<?xml version="1.0" encoding="UTF-8"?>
<!--
  A generic console gamepad, as line art, for a port's controls reference card.

  **Deliberately not any particular pad.** The shape is the familiar two-grip layout every
  modern controller shares - twin sticks, a four-way pad, four face buttons in a diamond, two
  pairs of shoulder buttons, a centre touch surface - and nothing on it is a trademarked glyph.
  The face buttons are plain circles, numbered clockwise from the top in the order the labels
  refer to them, because a card that draws somebody's symbols is a card that cannot ship.

  **White on transparent, one stroke width, no fills.** A title tints it to whatever its own
  menu uses; filling it here would fight every theme it is drawn on. Rasterise with
  `render.sh`, which is beside this file.

  Coordinates are a 1000x640 box with the pad centred. The anchor points a card hangs its
  leader lines from are listed in `controller.map` so that a renderer does not have to guess
  where a button is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <g fill="none" stroke="#ffffff" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Body: shoulders across the top, flaring into two grips. -->
    <path d="M 330 190
             C 250 190 205 232 190 300
             C 172 385 168 470 196 552
             C 222 616 292 630 338 596
             C 374 570 396 526 430 508
             C 452 497 476 494 500 494
             C 524 494 548 497 570 508
             C 604 526 626 570 662 596
             C 708 630 778 616 804 552
             C 832 470 828 385 810 300
             C 795 232 750 190 670 190
             Z" />

    <!-- Shoulder buttons. The upper pair sit behind the body edge, so they are drawn as
         partial outlines rather than closed shapes - a closed rectangle floating above the
         shell reads as a separate object. -->
    <path d="M 236 196 C 244 168 268 154 300 154 L 352 154 C 372 154 384 162 388 176" />
    <path d="M 764 196 C 756 168 732 154 700 154 L 648 154 C 628 154 616 162 612 176" />
    <path d="M 250 165 C 258 140 282 127 312 127 L 356 127" />
    <path d="M 750 165 C 742 140 718 127 688 127 L 644 127" />

    <!-- Four-way pad. One cross outline, not four keys: it is one rocker on every pad that
         has ever shipped, and drawing four separate buttons misdescribes it. -->
    <path d="M 286 246 L 314 246 L 314 288 L 356 288 L 356 316 L 314 316
             L 314 358 L 286 358 L 286 316 L 244 316 L 244 288 L 286 288 Z" />

    <!-- Face buttons, numbered clockwise from the top: 1 up, 2 right, 3 down, 4 left. -->
    <circle cx="700" cy="258" r="23" />
    <circle cx="744" cy="302" r="23" />
    <circle cx="700" cy="346" r="23" />
    <circle cx="656" cy="302" r="23" />

    <!-- Analogue sticks: the well, then the thumb cap. -->
    <circle cx="398" cy="432" r="50" />
    <circle cx="398" cy="432" r="32" />
    <circle cx="602" cy="432" r="50" />
    <circle cx="602" cy="432" r="32" />

    <!-- Centre touch surface. -->
    <rect x="428" y="238" width="144" height="104" rx="16" />

    <!-- Small centre buttons either side of it. -->
    <rect x="392" y="250" width="18" height="30" rx="7" />
    <rect x="590" y="250" width="18" height="30" rx="7" />

    <!-- Centre system button, below the touch surface. -->
    <circle cx="500" cy="372" r="14" />

  </g>
</svg>
