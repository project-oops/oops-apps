# ocornut/imgui's origin, pinned to the revision `libultraship` asks for.

# Dear ImGui, the immediate-mode UI. `libultraship` builds its debug and configuration interface
# on it and declares it in `cmake/dependencies/common.cmake:9`.
#
# An annotated tag, so `git ls-remote` returns a pair and the peeled line is the commit:
# `refs/tags/v1.91.9b-docking` is the tag object 52fe0a05, and the revision below is what it
# points at. The `-docking` branch is not optional - libultraship uses docking and multi-viewport,
# which are not in a release tag without it.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/ocornut/imgui
UPSTREAM_REV=4806a1924ff6181180bf5e4b8b79ab4394118875
UPSTREAM_REF=v1.91.9b-docking
