# SDL3's origin. Read by `common/upstream-fetch.sh`, which is shared with the titles - the same
# KEY=value shape `app.env` has, so make needs no parser for it.
#
# UPSTREAM_REV is what gets checked out and must be a full commit hash: a tag can be moved and a
# branch always is, so neither is a pin. UPSTREAM_REF says which release that hash is, for a
# reader.
#
# A lightweight tag: `git ls-remote refs/tags/release-3.4.16` answers with the commit and has no
# peeled `^{}` line.
#
# SDL3 sits beside `oops-deps/sdl2` rather than replacing it: SDL3 renamed the configuration
# header, changed the backend driver interfaces and removed parts of the 2.x API. SDL2 programs
# use `sdl2`; SDL3 programs use this. `sdl2-compat` runs SDL2 programs on SDL3, which is the
# other direction.
#
# **No title uses this yet, and Bugdom is not one of them** - that was the assumption it was
# vendored under and it did not hold. Bugdom's `master` requires SDL3; the revision its lock pins,
# 1.3.4, has `find_package(SDL2 REQUIRED COMPONENTS main)` and `#include <SDL.h>` throughout, as
# does Bugdom 2's pinned v4.0.0. Both build against `oops-deps/sdl2`. This is ready for the title
# that needs it.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/libsdl-org/SDL
UPSTREAM_REV=fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
UPSTREAM_REF=release-3.4.16
