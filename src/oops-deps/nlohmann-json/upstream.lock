# nlohmann/json's origin, pinned to the revision `libultraship` asks for (`GIT_TAG v3.12.0`).
#
# An annotated tag: `git ls-remote refs/tags/v3.12.0` answers the tag object `65ee6845...`, and
# the hash below is the commit it points at. The fetch script refuses a mismatch.
#
# Header-only; Ship of Harkinian includes it and links nothing.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/nlohmann/json
UPSTREAM_REV=55f93686c01528224f448c19128836e7df245f72
UPSTREAM_REF=v3.12.0

# Sparse: the tree is mostly conformance data. `single_include` is the amalgamated header and
# `include` the split form it is generated from.
UPSTREAM_SPARSE=single_include include
