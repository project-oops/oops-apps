# libjpeg-turbo's origin. Neverball decodes JPEG textures through it - one source, `fs_jpg.c`.
#
# **A lightweight tag**, unlike the four codec locks beside it: `refs/tags/3.1.4` and its peeled
# form give the same answer.
#
# libjpeg-turbo rather than the original IJG libjpeg because it is the maintained one and is
# API-compatible with it - a program written against `jpeglib.h` builds against either.
#
# **SIMD is off.** The turbo in the name is hand-written assembly per architecture, built through
# CMake with NASM; the C fallback decodes the same images and is what a first port wants. A
# title that finds JPEG decode is its bottleneck can revisit that with a measurement in hand.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/libjpeg-turbo/libjpeg-turbo
