# SDL2's origin. Read by `common/upstream-fetch.sh`, in the same KEY=value shape as `app.env`.
#
# UPSTREAM_REV is a full commit hash, since a tag can be moved. UPSTREAM_REF names the release
# for a reader. `release-2.30.9` is a lightweight tag, so the hash is the commit itself.
# 2.30.x is the maintained 2.x line; sdl12-compat builds on it.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/libsdl-org/SDL
UPSTREAM_REV=c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
UPSTREAM_REF=release-2.30.9
