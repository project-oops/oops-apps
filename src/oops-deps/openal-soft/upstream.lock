# OpenAL Soft's origin. Read by `common/upstream-fetch.sh`, fetched by `common/deps-fetch.sh`.
#
# `1.23.1` rather than 1.24: 1.24 is C++17, vendors `fmt` and adds `common/filesystem.cpp` over
# `std::filesystem`, which the libc++ here does not provide. 1.23.1 is C++14 with neither.
#
# A lightweight tag: `refs/tags/1.23.1` has no peeled `^{}` line, so the hash is the commit.
#
# SuperTux and SuperTuxKart are written against the OpenAL API. Output goes through upstream's
# `alc/backends/sdl2.cpp` to `oops-deps/sdl2`'s Prospero audio backend.
#
# `UPSTREAM_SPARSE` takes the library and leaves the examples, utilities and HRTF tables behind.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/kcat/openal-soft
UPSTREAM_REV=d3875f333fb6abe2f39d82caca329414871ae53b
UPSTREAM_REF=1.23.1

UPSTREAM_SPARSE=al alc common core include
