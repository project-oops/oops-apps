# SQLite's origin: the amalgamation, the single `sqlite3.c` the project publishes for embedding.
# Luanti keeps a world's map, players and mod storage in it (`src/CMakeLists.txt:215`, required).
#
# The amalgamation is generated by SQLite's own build (it needs Tcl), and is published only as a
# download - the project's git mirror carries the sources it is generated from. So this is an
# archive pin: the digest is SHA-256 of the file, computed here, because sqlite.org lists SHA3-256.
