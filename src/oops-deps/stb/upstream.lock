# stb's origin.
#
# libultraship's `cmake/dependencies/common.cmake:55` fetches `stb_image.h` at commit `0bc88af4`
# by raw URL to decode PNG and JPEG textures. This pins the same commit as a repository, so the
# hash is verified, and sparse, so only that header lands.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/nothings/stb
UPSTREAM_REV=0bc88af4de5fb022db643c2d8e549a0927749354
UPSTREAM_REF=0bc88af4 (the commit libultraship names)
UPSTREAM_SPARSE=stb_image.h
