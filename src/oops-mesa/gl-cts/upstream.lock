# The OpenGL Conformance Test Suite, from Khronos.
#
# Pinned to the `opengl-cts-4.6.8.1` release so pass tables are comparable. The hash is the
# peeled tag (`^{}`), which is what a checkout reports as `rev-parse HEAD`.
#
# Sparse: `framework/` (delibs, tcu, glu, qphelper, referencerenderer), `external/openglcts`
# (the GL test modules and their data), and `modules/glshared`, which four openglcts tests
# include directly. glslang and spirv-tools are fetched by upstream's own script, so no
# sparse path reaches them; `shim/gl_cts_spirv_stub.cpp` stands in for `glcSpirvUtils.cpp`.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/KhronosGroup/VK-GL-CTS.git
UPSTREAM_REV=067e8832315e79817ede1c4863804e440f5d1c80
UPSTREAM_REF=opengl-cts-4.6.8.1
UPSTREAM_SPARSE=framework external/openglcts modules/glshared
