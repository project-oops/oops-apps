# Extreme Tux Racer's origin. Read by `common/upstream-fetch.sh`, shared with every title.
#
# UPSTREAM_REV is a full commit hash. The origin has no tags, so there is no UPSTREAM_REF.
#
# Upstream proper is Subversion on SourceForge. This git mirror (RKSimon) is the meveric
# SDL 1.2 tree with the SDL2 port done, so the title needs no sdl12-compat. The lutris mirror
# tracks modern ETR, which uses SFML, a dependency nothing else here shares.
# The mirror is unmaintained: it takes no upstream fixes, and a bump means another mirror.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/RKSimon/extremetuxracer
UPSTREAM_REV=ff576bc46ea92093b35d708ad657aa994a6789d2
