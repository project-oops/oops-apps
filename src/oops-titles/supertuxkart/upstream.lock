# SuperTuxKart's origin. Read by common/app.mk with no parser - the same KEY=value shape app.env
# has - and by common/upstream-fetch.sh, which is shared by every title.
#
# UPSTREAM_REV is what gets checked out, and it must be a full commit hash: a tag can be moved
# and a branch always is, so neither is a pin. UPSTREAM_REF is there to tell a reader which
# release that hash is.
#
# **`1.5`, with no `v`.** SuperTuxKart's tags changed shape at 1.0: the 0.x releases are `v0.9`
# and earlier, the 1.x ones are bare numbers. A `v`-prefixed grep finds the old line and stops
# at `v0.9`, which looks like the newest release and is six years older than it. Noted because
# the mistake is invisible once made - `v0.9` is a real tag and pinning it produces a working
# checkout of the wrong thing.
#
# **`1.5` is a lightweight tag**, so the hash below is the commit directly and there is no peeled
# `^{}` line to miss - unlike `armagetron-advanced/upstream.lock`, which is the other case.
# Checked rather than assumed: `git ls-remote --tags` lists `1.5` once, while the neighbouring
# `1.5-rc1` does carry a `^{}` companion.
#
# **The assets are a second repository and are not pinned here.** `stk-assets` is about a
# gigabyte of karts, tracks and audio, and SuperTuxKart does not start without it. This lock
# covers `stk-code` only. Whether the assets become a second lock in this directory, an
# `src/oops-deps/` entry, or something the package step fetches the way Neverball's `make
# package` copies `upstream/data`, is undecided - see docs/PORTING.md.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/supertuxkart/stk-code
UPSTREAM_REV=1fb491f507216c5d181ccd85f29ff08eca003827
UPSTREAM_REF=1.5 (2024; the 1.x tags drop the `v` the 0.x ones had)
