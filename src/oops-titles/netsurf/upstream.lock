# NetSurf's origin - a web browser in C with its own layout engine, built here with its
# framebuffer front end, which draws through SDL.
#
# The browser is one repository and its parsers and decoders (libcss, libdom, libhubbub,
# libnsfb and the rest) are each their own. The project's mirrors of the libraries carry no
# release tags, so the pin is the release's full-source bundle instead: NetSurf 3.11 with
# every library and the build system at the versions it shipped with, unpacked to
# `upstream/netsurf-all-3.11/`. These libraries are NetSurf's alone, so they stay in this
# title rather than under `src/oops-deps/`.
#
# The pin is the bundle's digest.
