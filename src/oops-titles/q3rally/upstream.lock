# Q3Rally's origin. Read by common/app.mk (KEY=value, like app.env) and by
# common/upstream-fetch.sh.
#
# UPSTREAM_REV is a full commit hash; UPSTREAM_REF names the release it is. `v0.7d` is a
# lightweight tag, so the tag and the commit are the same object. The pin is the newest
# release, which carries `engine/code/renderergl1`.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/Q3Rally-Team/q3rally
UPSTREAM_REV=26828942cc3ff6f0713829cb82afe4940a3fa57b
UPSTREAM_REF=v0.7d
