# Ship of Harkinian's origin.
#
# `Shipwright` is the repository, "Ship of Harkinian" the program, and `soh` the binary it
# builds. It is a native port of Ocarina of Time on the `zeldaret/oot` decompilation and
# reads the player's own ROM at run time (see README.md here).
#
# Pinned to the `9.2.3` release ("Ackbar Delta", 2026-04-14). `9.2.3` is a lightweight tag,
# so the ref and the commit are the same object. The fetch script refuses a checkout whose
# `rev-parse HEAD` differs from UPSTREAM_REV.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/HarbourMasters/Shipwright
UPSTREAM_REV=cb71e22a79bc5d1f688fa881795bbd93094895fc
UPSTREAM_REF=9.2.3

# `libultraship` is the runtime (renderer, audio, resources, input) and `torch` turns a ROM
# into the `.o2r` archive the game loads; the build needs both. The pinned commit records
# the submodule revisions, so one hash pins everything.
UPSTREAM_SUBMODULES=1
