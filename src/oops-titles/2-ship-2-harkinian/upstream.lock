# 2 Ship 2 Harkinian's origin.
#
# `2ship2harkinian` is the repository, "2 Ship 2 Harkinian" the program, and `2s2h` the binary it
# builds. It is a native port of Majora's Mask on the `zeldaret/mm` decompilation and
# reads the player's own ROM at run time (see README.md here).
#
# Pinned to the `5.0.1` release ("Battler Bravo"). `5.0.1` is a release tag. The fetch script
# refuses a checkout whose `rev-parse HEAD` differs from UPSTREAM_REV.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/2ship2harkinian/2ship2harkinian
UPSTREAM_REV=8a24047fbce8915993804e7819f4df4fa591551f
UPSTREAM_REF=5.0.1

# `libultraship` is the runtime (renderer, audio, resources, input) and `OTRExporter` turns a ROM
# into the `.o2r` archive the game loads; the build needs both. The pinned commit records
# the submodule revisions, so one hash pins everything.
UPSTREAM_SUBMODULES=1
