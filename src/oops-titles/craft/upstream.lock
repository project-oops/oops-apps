# Craft's origin, in the KEY=value shape app.env has. Read by common/app.mk and by
# common/upstream-fetch.sh.
#
# UPSTREAM_REV is what gets checked out and is a full commit hash, since a tag or branch
# can move. UPSTREAM_REF tells a reader which release that hash is.
#
# The pin is master's final commit rather than the `v1.0` tag. The commits after `v1.0`
# are a vendored GLFW update this port does not compile, an error-and-exit in
# `src/util.c` when a shader or texture will not open, README text and a server-side
# `-fPIC`. `v1.0` is a lightweight tag, so `fe3e7b3f` is the commit itself.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/fogleman/Craft
UPSTREAM_REV=d6888a6e1e54340358ce25b1220f410541360b6b
UPSTREAM_REF=master (2021-02-24; v1.0 is fe3e7b3f, 2014-02-02)
