# Neverputt's origin, which is Neverball's: the same repository and pinned commit.
#
# Neverputt is the second binary of the Neverball tree (`PUTT_OBJS` in upstream's Makefile,
# `main` at `putt/main.c:279`). It has its own checkout so a title never reads a sibling
# title's working tree. Keep it at the same revision as `../neverball/upstream.lock`: the two
# share every file under `share/`.
#
# `neverball-1.6.0` is an annotated tag: UPSTREAM_REV is the commit it peels to, not the tag
# object.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/Neverball/neverball
UPSTREAM_REV=16945b8abe77fdaf0d3b6728f7cd25819bb0a707
UPSTREAM_REF=neverball-1.6.0
