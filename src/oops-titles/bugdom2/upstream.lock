# Bugdom 2's origin, read by common/app.mk and common/upstream-fetch.sh as KEY=value lines.
#
# UPSTREAM_REV is a full commit hash: a tag can be moved and a branch always is. UPSTREAM_REF names
# the release that hash is, for a reader. v4.0.0 is upstream's only tag, and it is lightweight, so the
# ref and the commit are the same object.
#
# The revision asks for SDL2, not SDL3. Read the revision the lock names rather than a clone on disk.
#
# The game data is in this repository under Data/: Pangea released Bugdom 2 as freeware and jorio's
# port ships it, so the title needs nothing from the player, which is the bar src/oops-titles/README.md
# sets.
#
# extern/Pomme is a submodule and the build does not exist without it: it is jorio's reimplementation
# of the classic Mac OS toolbox. Its revision is not repeated here, because it lives in the pinned
# commit's own tree, so one hash pins everything.
UPSTREAM_SUBMODULES=1
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/jorio/Bugdom2
UPSTREAM_REV=4050d6f97bf5d8b7ac9e91b1b7d4eacf3a4af87c
UPSTREAM_REF=v4.0.0
