# SuperTux's origin. Read by common/app.mk as KEY=value lines, like app.env, and by
# common/upstream-fetch.sh.
#
# UPSTREAM_REV is the checked-out commit and must be a full hash; UPSTREAM_REF names the
# release it is.
#
# v0.6.3 is the newest stable release on SDL2. master and v0.7.0 are SDL3
# (`gl_video_system.cpp` calls `SDL_GL_DestroyContext`), and `src/oops-deps/` pins SDL2 and
# no SDL3. v0.6.3 carries the ES 2.0 renderer this port targets: `USE_OPENGLES2` and
# `data/shader/shader100.*` (docs/PORTING.md, The renderer). `v0.6.3` is a lightweight tag,
# so the hash is the tagged commit.
#
# UPSTREAM_SPARSE is absent: `src/` is the program and `data/` is content it needs to start.
#
# UPSTREAM_SUBMODULES=1 because four submodules are part of the game: PhysFS opens every
# file, Squirrel runs level scripts, sexp-cpp parses levels and tinygettext holds the
# translations. The pinned commit records each submodule's revision, so one hash pins all:
#
#   external/physfs       36504d7207df8a93e6f36e016c47fbfabb8e1ed8
#   external/squirrel     dda695e95f221b5e038796eab1f13d734dbd7270
#   external/sexp-cpp     6018831abc1e5d5020c7b62f99962806dacf4c9f
#   external/tinygettext  355659015e557749f6b514881c3a35d44d6e5f57
#
# They build with this title rather than in `src/oops-deps/`, which holds libraries shared
# by more than one title.
#
# `external/SDL_ttf` and `external/discord-sdk` are fetched but not compiled: the fetch
# checks every declared submodule is non-empty. `oops-deps/sdl2-ttf` stands in for the
# SDL_ttf fork, and Discord is off in `shim/include/config.h`.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/SuperTux/supertux
UPSTREAM_REV=c1ddb4f28c54de77f07aa9965231a91c0ed06708
UPSTREAM_REF=v0.6.3 (2022-02-06; master is SDL3 and v0.7.0 is that line)
UPSTREAM_SUBMODULES=1
