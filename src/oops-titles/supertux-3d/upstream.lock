# SuperTux 3D's origin. Read by common/app.mk with no parser - the same KEY=value shape app.env
# has - and by common/upstream-fetch.sh, which is shared by every title.
#
# **No UPSTREAM_REF, because upstream has no tags at all.** `git ls-remote --tags` returns nothing,
# so there is no release name to record beside the hash. Naming the branch would be worse than
# naming nothing: a branch moves, and the lock would read as if it recorded something stable.
#
# The revision below is `main` as of this scaffold. It is the newest commit and also a fairly old
# one - 2020-04-27 - which is a fact about the project rather than about the pin.
#
# **This title cannot be built yet and the lock is still worth having.** It is a Godot project: the
# repository is 22 `.gd` scripts and their scenes, with no engine source, so porting it means
# porting Godot. docs/PORTING.md says what that would take and why it is a different kind of job
# from every other title here.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/edstoner/supertux_3d
UPSTREAM_REV=5d409c087d1c2e1db7026a5467bb2835c42f647e
