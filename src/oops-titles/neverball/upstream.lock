# Neverball's origin. Read by common/app.mk (KEY=value, like app.env) and by
# common/upstream-fetch.sh.
#
# UPSTREAM_REV is a full commit hash; UPSTREAM_REF names the release it is. The pin is the
# newest release, not the newest commit.
# `neverball-1.6.0` is an annotated tag: UPSTREAM_REV is the commit it peels to (the `^{}`
# line of `git ls-remote --tags`), not the tag object.
UPSTREAM_KIND=git
UPSTREAM_URL=https://github.com/Neverball/neverball
UPSTREAM_REV=16945b8abe77fdaf0d3b6728f7cd25819bb0a707
UPSTREAM_REF=neverball-1.6.0
