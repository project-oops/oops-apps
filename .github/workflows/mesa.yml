name: Build oops-mesa

# Bring-up workflow for the heavy dependency: compile upstream Mesa for the target and publish
# its archives, so the USE_MESA titles (mesa-cube, mesa-demos, gl-cts, ...) can link them in the
# release. It is `workflow_dispatch` only for now - the Mesa build is a ~40-60 minute container
# compile that pulls a pinned FreeBSD source and the Mesa submodule, so it runs on demand while
# it is being stabilised, then folds into release.yml once green.
#
# Nothing depends on this yet, so a failure here cannot regress the working (non-mesa) release.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oops-mesa-build
  cancel-in-progress: true

jobs:
  build:
    name: compile Mesa for the target
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tools this job needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git ca-certificates

      # The collection, this repo inside it, then oops-mesa and its Mesa submodule.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
      # obscene too: the platform-stubs stage reads obSCEne's measured import census
      # (data/hardware/ps5-imports.txt) to answer Mesa's "does this symbol exist" probes.
      # obscene for the import census; oops-sdk because the mesa titles build on it, and this
      # workflow now also links them against the archives it produces.
      - name: oops-mesa, obscene, and the SDK the titles build on
        run: |
          OOPS/bin/oops bootstrap oops-mesa obscene oops-sdk
          (cd OOPS/oops-apps && ./common/deps-fetch.sh) || echo "deps-fetch: some upstreams unavailable, continuing"
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}
      # Mesa as a **standalone** clone at the pin, not a submodule: oops-mesa applies its patches
      # with `git apply`, and a submodule checkout's `.git` is a gitlink file pointing into the
      # superproject's module store - a path that does not exist in this assembled checkout, so
      # git reports "not a git repository". A plain clone has a real .git and patches apply.
      - name: The pinned Mesa source, as a standalone tree
        run: |
          MESA_PIN=$(sed -n 's/^MESA_PIN *:= *//p' OOPS/oops-mesa/dependencies.mk)
          rm -rf OOPS/oops-mesa/mesa
          git clone --filter=blob:none --no-checkout https://gitlab.freedesktop.org/mesa/mesa.git OOPS/oops-mesa/mesa
          git -C OOPS/oops-mesa/mesa checkout --detach "$MESA_PIN"

      - name: Read the pins
        id: pins
        run: |
          echo "fbsd=$(sed -n 's/^SYSROOT_PIN *:= *//p' OOPS/oops-mesa/dependencies.mk)" >> "$GITHUB_OUTPUT"

      # The FreeBSD source the sysroot is staged from, at the pinned revision. A blob-filtered
      # clone keeps it to the trees plus the blobs the pin's checkout actually needs; cached by
      # the pin so it is fetched once. stage-sysroot.sh checks HEAD equals this pin.
      - name: Cache the FreeBSD source
        id: cache-fbsd
        uses: actions/cache@v4
        with:
          path: freebsd-src
          key: freebsd-src-${{ steps.pins.outputs.fbsd }}
      - name: FreeBSD source at the pin
        if: steps.cache-fbsd.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/freebsd/freebsd-src.git freebsd-src
          git -C freebsd-src checkout --detach "${{ steps.pins.outputs.fbsd }}"

      # The archives themselves, keyed on everything that determines them: the Mesa/FreeBSD pins
      # and oops-mesa's own toolchain and patches. A hit skips the whole compile.
      # Cache both halves of a title's link: the Mesa archives under build/, and the support
      # archives (C++ runtime, libelf, libm, librune, cpu_model, the platform stub) that
      # build-mesa.sh writes to toolchain/sysroot/usr/lib. Caching build/ alone left the second
      # set missing on a cache hit, so every title failed the link on `-loopsmesa_cxx` and its
      # kin. `-v2` retires the build-only cache.
      - name: Cache the Mesa build
        id: cache-mesa
        uses: actions/cache@v4
        with:
          path: |
            OOPS/oops-mesa/build
            OOPS/oops-mesa/toolchain/sysroot/usr/lib
          key: oops-mesa-build-v2-${{ hashFiles('OOPS/oops-mesa/dependencies.mk', 'OOPS/oops-mesa/toolchain/**', 'OOPS/oops-mesa/patches/**', 'OOPS/oops-mesa/oops-mesa.mk') }}

      - name: Build Mesa
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: |
          cd OOPS/oops-mesa
          OOPS_MESA_FREEBSD_SRC="$GITHUB_WORKSPACE/freebsd-src" ./bin/oops-mesa build

      - name: What was built
        run: |
          echo "== link-order.txt =="
          cat OOPS/oops-mesa/build/link-order.txt 2>/dev/null || echo "(no link-order.txt - the build did not finish)"
          echo "== archives =="
          find OOPS/oops-mesa/build -name '*.a' | sort

      # The sysroot (FreeBSD headers the hosted titles compile against) and the toolchain image
      # are produced by the Mesa build - but that step is skipped on a cache hit, so ensure both
      # exist here regardless. Staging the sysroot is cheap; the image is rebuilt only if missing.
      - name: Ensure the sysroot and toolchain image
        run: |
          cd OOPS/oops-mesa
          OOPS_MESA_FREEBSD_SRC="$GITHUB_WORKSPACE/freebsd-src" bash toolchain/stage-sysroot.sh
          image=$(sed -n 's/^TOOLCHAIN_IMAGE *:= *//p' dependencies.mk)
          docker image inspect "$image" >/dev/null 2>&1 || docker build -t "$image" toolchain/

      # Link each mesa title against the archives, in the clang-21 toolchain image. This is the
      # proof that the build is usable: if these link, the release can package them. Reported per
      # app, and the job does not fail on a title that does not link yet - that is a title's own
      # bring-up, not a fault in the Mesa build.
      - name: Link the mesa titles against the archives
        run: |
          image=$(sed -n 's/^TOOLCHAIN_IMAGE *:= *//p' OOPS/oops-mesa/dependencies.mk)
          ok=""; bad=""
          for app in mesa-cube mesa-dri-probe mesa-winsys-probe gl-cts mesa-demos; do
            rel=$(cd OOPS/oops-apps && find src -maxdepth 3 -name Makefile -path "*/$app/Makefile" -exec dirname {} \;)
            echo "::group::$app ($rel)"
            if docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w "$image" \
                 bash -c "make -C 'OOPS/oops-apps/$rel' elf"; then
              ok="$ok $app"
            else
              bad="$bad $app"
            fi
            echo "::endgroup::"
          done
          echo "linked:$ok"
          echo "did not link:$bad"

      - uses: actions/upload-artifact@v4
        with:
          name: oops-mesa-build
          path: OOPS/oops-mesa/build
          if-no-files-found: error
