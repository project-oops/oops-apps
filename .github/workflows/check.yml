name: check

# Checks out the collection, this repository inside it, and runs the gate:
# formatting check, then each app's own gate (host selftests).
# Cross-compilation and packaging are handled by the parallel release matrix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: gate
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    steps:
      - name: Tools the container does not ship
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
          fetch-depth: 0

      - name: The compiler this build is pinned to
        run: clang --version | head -1

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-apps
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # The same gate a person runs: `./bin/oops-apps check` (formatting, then host selftests)
      - name: Gate
        run: ./bin/oops-apps check
        working-directory: OOPS/oops-apps
