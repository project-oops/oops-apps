name: Deploy docs to GitHub Pages

# Publishes the documentation and the apps index, as oops-libs and oops-sdk do.
# `paths-ignore` names what cannot change the site, so a new docs path is never missed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    # Pages does not serve a private repository on a free plan, so the job runs only while
    # the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-apps
        env:
          # Empty unless the org secret exists.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p site
          # The documentation under /docs/, by the collection's shared builder, in the
          # neutral grey used for repositories that are not one of the four projects.
          bash ../tools/build-docs.sh . site "#8b9096" "oops-apps"
          # The apps index at the site root, generated from each app's app.env, README and
          # screenshots; download buttons resolve from the rolling latest-main release.
          bash ../tools/build-apps-index.sh . site "#3fb950"
          du -sh site
        working-directory: OOPS/oops-apps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: OOPS/oops-apps/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
