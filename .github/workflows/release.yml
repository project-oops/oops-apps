name: release

# Publish every app's shippable artifacts to a single rolling `latest-main` prerelease.
#
# The shape is a matrix over the apps, and the app list is discovered rather than written
# down: the `discover` job asks `bin/oops-apps list` (a directory with a Makefile is an app),
# so a new app is built and published the day it exists, with nothing to add to this file.
#
# **CI never learns a format.** Each app's Makefile carries a `dist` target that stages what it
# ships - a plain `.elf` payload, a `.zip` title directory, a `.pkg`, whatever the app is -
# under its own `dist/`. This workflow runs `make dist` and uploads whatever lands there. An
# app with no `dist` target ships nothing this run, which is said out loud, not failed: a demo
# without a release is a normal state. See the release contract in `bin/oops-apps`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The app list, as JSON, for the build matrix. `bin/oops-apps list` is the one source of
  # truth for what an app is, here and for a person at a terminal.
  #
  # It takes the same three-step preamble as everything else even though listing directories
  # needs no siblings - one shape, so that reading any job in the collection teaches you all of
  # them, the way obSCEne's provenance job takes the preamble to compile nothing.
  discover:
    name: which apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      mesa_apps: ${{ steps.list.outputs.mesa_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-apps
        env:
          # Empty unless the org secret exists, and empty is the old behaviour.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}
      # Two lists, not one. A title that renders through Mesa (`OOPS_RENDERER = mesa`) needs the
      # whole oops-mesa build to link, which is a separate, heavy job - so those are split out to
      # `build-mesa` and the plain matrix never tries (and fails) to build them.
      - id: list
        run: |
          is_mesa() { grep -qE 'OOPS_RENDERER[[:space:]]*[:?]?=[[:space:]]*mesa|USE_MESA[[:space:]]*[:?]?=[[:space:]]*1' "$1/Makefile" "$1/app.env" 2>/dev/null; }
          plain=(); mesa=()
          for a in $(./bin/oops-apps list); do
            d=$(find src -maxdepth 3 -name Makefile -path "*/$a/Makefile" -exec dirname {} \;)
            if is_mesa "$d"; then mesa+=("$a"); else plain+=("$a"); fi
          done
          apps=$(printf '%s\n' "${plain[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          mesa_apps=$(printf '%s\n' "${mesa[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "mesa_apps=$mesa_apps" >> "$GITHUB_OUTPUT"
          echo "plain: $apps"
          echo "mesa:  $mesa_apps"
        working-directory: OOPS/oops-apps

  # Build the Rust packaging tools once and share them with every matrix cell. Without selfish
  # (the packager) and obscene-tool (the module tagger), `make dist` cannot produce a title: it
  # prints "selfish not found" and stages only the bare ELF. That is why the release carried
  # nothing but `.elf` until this job existed - the C cross-compiler in the build container has
  # no Rust, so the tools were never built. Built in the *same* container the apps build in, so
  # the binaries are glibc-compatible with the cells that run them.
  tools:
    name: build packaging tools
    needs: discover
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    steps:
      - name: Tools this job needs
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl build-essential ca-certificates
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
      # obscene-tool depends by path on selfish, prosperous and oops-libs, and selfish on its own
      # crates - so fetch the whole set rather than guess the closure.
      - name: The sibling sources the tools are built from
        run: OOPS/bin/oops bootstrap
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}
      - name: Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Build selfish and obscene-tool
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --manifest-path OOPS/selfish/Cargo.toml
          cargo build --release --manifest-path OOPS/obscene/tool/Cargo.toml
          mkdir -p out
          cp OOPS/selfish/target/release/selfish out/
          cp OOPS/obscene/tool/target/release/obscene-tool out/
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-tools
          path: out/

  # One cell per app, in parallel. `fail-fast: false` so one app's build failing does not pull
  # the finished ones down with it - each app is its own deliverable.
  build:
    name: "stage: ${{ matrix.app }}"
    needs: [discover, tools]
    runs-on: ubuntu-latest
    # **The pinned compiler, because the runner's own is not it.**
    #
    # `toolchain.mk` pins the collection to clang 21 and names the two runners that carry the
    # pin - WSL `oops-builder` and this container. Ubuntu's `clang` package is 18, so from the
    # day the pin landed every `make -n dist` here failed, every app was reported as having "no
    # dist target, nothing to ship yet", and the rolling release quietly stopped moving: its
    # assets sat at 2026-09-20 for four days while the workflow went green every time. The
    # publish job had nothing to publish and said so in the only way it could, by changing
    # nothing.
    #
    # An honest "nothing to ship" and a broken toolchain are the same message in this workflow,
    # which is what made it invisible. The container removes the second one.
    container: silkeh/clang:21
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      # Before `actions/checkout`, which silently falls back to a REST download without git -
      # and a download has no submodules, which this build needs.
      - name: Tools the container does not ship
        run: |
          apt-get update -qq
          apt-get install -y -qq git zip jq ca-certificates lld
      # The standard OOPS preamble: check out the collection, check this repository out into
      # it, ask bootstrap for the siblings the apps build against (oops-sdk, and selfish for
      # any app that packages). Never set a job-level working-directory.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps

      - name: The compiler this build is pinned to
        run: clang --version | head -1

      # The vendored dependency trees. `common/upstream.mk` fetches a *title's* own upstream at
      # Makefile-parse time and nothing fetched the dependencies', so a title with vendored
      # dependencies asked make for a source file that was never downloaded, make said "No rule
      # to make target", and the app was reported as shipping nothing. Idempotent: a tree
      # already at its revision costs a stamp comparison.
      - name: The dependency trees this build is pinned to
        run: ./common/deps-fetch.sh
        working-directory: OOPS/oops-apps

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-apps
        env:
          # Empty unless the org secret exists, and empty is the old behaviour.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # The packaging tools from the `tools` job, dropped where make's wildcard looks for them
      # (app.mk resolves SELFISH_BIN / MKMODULE_BIN by wildcard under these paths). With them in
      # place `make dist` can package a title; without them it could only ever stage the ELF.
      - name: The packaging tools this build needs
        uses: actions/download-artifact@v4
        with:
          name: packaging-tools
          path: tools-bin
      - name: Put the packaging tools where make expects them
        run: |
          install -Dm755 tools-bin/selfish OOPS/selfish/target/release/selfish
          install -Dm755 tools-bin/obscene-tool OOPS/obscene/tool/target/release/obscene-tool

      # `make dist` for this one app, through the same entry point a person uses. If the app
      # has no `dist` target it stages nothing and the upload below finds no files - honest,
      # and not a failure.
      - name: Stage ${{ matrix.app }}
        run: |
          ./bin/oops-apps dist ${{ matrix.app }}
          mkdir -p staging
          for d in src/*/${{ matrix.app }}/dist; do
            if [ -d "$d" ]; then
              cp -r "$d"/* staging/ 2>/dev/null || true
            fi
          done
        working-directory: OOPS/oops-apps

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app }}
          # Upload directly from flat staging directory so category hierarchy is not preserved
          path: OOPS/oops-apps/staging/*
          if-no-files-found: ignore

  # Build upstream Mesa for the target once, and cache it. This job only primes the cache; the
  # per-title cells below restore it, so a fresh cache builds Mesa once here rather than five
  # times in parallel. The cache is keyed on the pins and oops-mesa's own toolchain, so it
  # rebuilds only when one of those changes. See mesa.yml for the standalone bring-up of this.
  mesa:
    name: build oops-mesa
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tools this job needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
      - name: oops-mesa and obscene
        run: OOPS/bin/oops bootstrap oops-mesa obscene
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}
      - name: The pinned Mesa source, as a standalone tree
        run: |
          MESA_PIN=$(sed -n 's/^MESA_PIN *:= *//p' OOPS/oops-mesa/dependencies.mk)
          rm -rf OOPS/oops-mesa/mesa
          git clone --filter=blob:none --no-checkout https://gitlab.freedesktop.org/mesa/mesa.git OOPS/oops-mesa/mesa
          git -C OOPS/oops-mesa/mesa checkout --detach "$MESA_PIN"
      - id: pins
        run: echo "fbsd=$(sed -n 's/^SYSROOT_PIN *:= *//p' OOPS/oops-mesa/dependencies.mk)" >> "$GITHUB_OUTPUT"
      - name: Cache the FreeBSD source
        id: cache-fbsd
        uses: actions/cache@v4
        with:
          path: freebsd-src
          key: freebsd-src-${{ steps.pins.outputs.fbsd }}
      - name: FreeBSD source at the pin
        if: steps.cache-fbsd.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/freebsd/freebsd-src.git freebsd-src
          git -C freebsd-src checkout --detach "${{ steps.pins.outputs.fbsd }}"
      - name: Cache the Mesa build
        id: cache-mesa
        uses: actions/cache@v4
        with:
          path: |
            OOPS/oops-mesa/build
            OOPS/oops-mesa/toolchain/sysroot
          key: oops-mesa-build-v3-${{ hashFiles('OOPS/oops-mesa/dependencies.mk', 'OOPS/oops-mesa/toolchain/**', 'OOPS/oops-mesa/patches/**', 'OOPS/oops-mesa/oops-mesa.mk') }}
      - name: Build Mesa
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: |
          cd OOPS/oops-mesa
          OOPS_MESA_FREEBSD_SRC="$GITHUB_WORKSPACE/freebsd-src" ./bin/oops-mesa build

  # One cell per mesa title. Each restores the cached Mesa build (primed by `mesa`), clones the
  # Mesa headers, places the packaging tools, and packages the title inside the clang-21 toolchain
  # image - the same route that linked all five in mesa.yml. `fail-fast: false`, so a title that
  # does not build yet does not pull the others down, and `release` publishes whatever staged.
  build-mesa:
    name: "mesa title: ${{ matrix.app }}"
    needs: [discover, tools, mesa]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.mesa_apps) }}
    steps:
      - name: Tools this job needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl build-essential ca-certificates zip jq lld
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-apps
      - name: oops-mesa, obscene, the SDK, and app deps
        run: |
          OOPS/bin/oops bootstrap oops-mesa obscene oops-sdk
          (cd OOPS/oops-apps && ./common/deps-fetch.sh) || echo "deps-fetch: some upstreams unavailable"
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}
      - name: The pinned Mesa source (headers)
        run: |
          MESA_PIN=$(sed -n 's/^MESA_PIN *:= *//p' OOPS/oops-mesa/dependencies.mk)
          rm -rf OOPS/oops-mesa/mesa
          git clone --filter=blob:none --no-checkout https://gitlab.freedesktop.org/mesa/mesa.git OOPS/oops-mesa/mesa
          git -C OOPS/oops-mesa/mesa checkout --detach "$MESA_PIN"
      - name: Restore the Mesa build (primed by the mesa job)
        uses: actions/cache/restore@v4
        with:
          path: |
            OOPS/oops-mesa/build
            OOPS/oops-mesa/toolchain/sysroot
          key: oops-mesa-build-v3-${{ hashFiles('OOPS/oops-mesa/dependencies.mk', 'OOPS/oops-mesa/toolchain/**', 'OOPS/oops-mesa/patches/**', 'OOPS/oops-mesa/oops-mesa.mk') }}
          fail-on-cache-miss: true
      - name: The toolchain image
        run: |
          image=$(sed -n 's/^TOOLCHAIN_IMAGE *:= *//p' OOPS/oops-mesa/dependencies.mk)
          docker image inspect "$image" >/dev/null 2>&1 || docker build -t "$image" OOPS/oops-mesa/toolchain/
      - name: The packaging tools
        uses: actions/download-artifact@v4
        with:
          name: packaging-tools
          path: tools-bin
      - name: Place the packaging tools
        run: |
          install -Dm755 tools-bin/selfish OOPS/selfish/target/release/selfish
          install -Dm755 tools-bin/obscene-tool OOPS/obscene/tool/target/release/obscene-tool
      - name: Package ${{ matrix.app }}
        run: |
          image=$(sed -n 's/^TOOLCHAIN_IMAGE *:= *//p' OOPS/oops-mesa/dependencies.mk)
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w "$image" \
            bash -c "cd OOPS/oops-apps && ./bin/oops-apps dist ${{ matrix.app }}"
          mkdir -p staging
          for d in OOPS/oops-apps/src/*/${{ matrix.app }}/dist; do
            [ -d "$d" ] && cp -r "$d"/* staging/ 2>/dev/null || true
          done
          ls -l staging || echo "nothing staged for ${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app }}
          path: staging/*
          if-no-files-found: ignore

  # Collect every app's staged files and replace the rolling `latest-main` prerelease. Runs
  # only on a push to main (or manual dispatch); a pull request builds the apps but publishes nothing.
  release:
    name: publish latest-main
    needs: [discover, build, build-mesa]
    # **`always()`, because the matrix already says each app is its own deliverable.**
    #
    # `fail-fast: false` above stops one app's failure from cancelling the others, and then this
    # job's default `needs` requirement threw that away: it waits for *every* cell to succeed, so
    # a single app that cannot build keeps every app that can out of the release. Eight of
    # twenty-five fail today - most of them wanting the oops-mesa sibling - and they had been
    # holding back the seventeen that build, Neverball among them, for as long as they have been
    # failing.
    #
    # Publishing what was staged is the honest reading of the contract: the run is still marked
    # failed, the broken apps are still red and still named, and the apps that built are still
    # downloadable. A release that waits for the worst app in the repository is a release nobody
    # can rely on.
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: app-*

      - name: Lay the apps out for download
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # Each artifact is `app-<name>/` holding that app's dist files.
          # Enforce OOPS CONVENTIONS.md section 2: every file must start with the app name,
          # encode the target generation, and be packaged as a file (never an unzipped directory).
          for d in staged/app-*/; do
            app=$(basename "$d"); app=${app#app-}
            for f in "$d"*; do
              [ -e "$f" ] || continue
              if [ -d "$f" ]; then
                echo "::error file=$f::Directory in staged artifacts for $app; titles must be packaged as .zip" >&2
                exit 1
              fi
              fname=$(basename "$f")
              case "$fname" in
                "$app"-*)
                  case "$fname" in
                    *-orbis*|*-neo*|*-prospero*|*-trinity*) ;;
                    *)
                      echo "::error file=$f::Artifact $fname does not encode a target generation per CONVENTIONS.md section 2" >&2
                      exit 1
                      ;;
                  esac
                  cp "$f" "dist/${fname}"
                  ;;
                *)
                  echo "::error file=$f::Artifact $fname in $app does not begin with the app name '$app-'" >&2
                  exit 1
                  ;;
              esac
            done
          done
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ls -l dist
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "no app staged a dist this run - nothing to publish"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when something is actually there. An empty release is worse than none - it looks
      # like a build that shipped and left the page blank.
      - name: Replace the previous latest-main
        if: steps.collect.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - uses: softprops/action-gh-release@v2
        if: steps.collect.outputs.any == 'true'
        with:
          tag_name: latest-main
          name: "Latest main build"
          prerelease: true
          make_latest: "false"
          draft: false
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Auto-built from `main` at `${{ github.sha }}`.

            Every app here is built on [oops-sdk](https://github.com/project-oops/oops-sdk) and
            ships whatever its own Makefile's `dist` target produces - a plain `.elf` payload
            for a homebrew loader, a `.zip` title directory, a package. The filename is
            prefixed with the app it came from.

            **These are ordinary homebrew.** They need no vendor toolchain to build and carry
            nothing from one. An app is present here only once its Makefile declares what it
            ships; an app still in development is built and checked but publishes nothing.
